name: Supabase keep-alive

on:
  schedule:
    - cron: "0 22 * * *" # daily, ~8am AEST
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node .github/scripts/keepalive.mjs
