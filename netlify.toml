[build]
  publish = "site"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' https://api.fontshare.com 'unsafe-inline'; font-src 'self' https://cdn.fontshare.com; img-src 'self'; connect-src 'self' https://gbcttmrgvbjcsxvlbwfi.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# admin.html signs in via Supabase Auth and reads the `leads` table directly
# from the browser (see site/js/admin.js) — connect-src above allows those
# calls to the Supabase project. No script-src change was needed since
# admin.js is a same-origin file, not a third-party script.
